# HTTP-only. Mount this folder instead of nginx/prod until Let's Encrypt is issued.
# docker-compose.prod.yml → nginx volumes: ./nginx/bootstrap:/etc/nginx/conf.d
server {
    listen 80 default_server;
    server_name acoedu.ru www.acoedu.ru learn.acoedu.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "ACO TLS bootstrap\n";
        add_header Content-Type text/plain;
    }
}
