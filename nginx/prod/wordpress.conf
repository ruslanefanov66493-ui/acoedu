server {
    listen 80;
    server_name acoedu.ru www.acoedu.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.acoedu.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name acoedu.ru;

    ssl_certificate     /etc/letsencrypt/live/acoedu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acoedu.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://www.acoedu.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.acoedu.ru;

    ssl_certificate     /etc/letsencrypt/live/acoedu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acoedu.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.php index.html;
    client_max_body_size 64m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $wordpress_upstream wordpress;
        fastcgi_pass $wordpress_upstream:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_read_timeout 120s;
    }

    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    location ~ /\.ht {
        deny all;
    }
}
